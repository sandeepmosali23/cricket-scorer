<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#16a34a"/>

  <!-- Cricket Ball -->
  <circle cx="65" cy="40" r="10" fill="#dc2626"/>
  <path d="M 58 37 Q 65 35, 72 37" stroke="white" stroke-width="1.5" fill="none"/>
  <path d="M 58 43 Q 65 45, 72 43" stroke="white" stroke-width="1.5" fill="none"/>

  <!-- Cricket Bat -->
  <g transform="translate(30, 30) rotate(-30)">
    <rect x="8" y="0" width="5" height="20" fill="#8b4513" rx="1"/>
    <ellipse cx="10.5" cy="22" rx="7" ry="14" fill="#d4a574"/>
  </g>

  <!-- Letter H -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">
    H
  </text>
</svg>
